[package]
name = "psp"
version = "0.3.12"
description = "A library for building full PSP modules, including both PRX plugins and regular homebrew apps."
readme = "../README.md"
repository = "https://github.com/overdrivenpotato/rust-psp"
license = "MIT"
authors = [
    "Marko Mijalkovic <marko.mijalkovic97@gmail.com>",
    "Paul Sajna <sajattack@gmail.com>"
]
edition = "2018"
build = "build.rs"

[lib]
# NOTE(dreamcart fork): "staticlib" removed. rustc must resolve the global
# allocator when emitting a staticlib artifact, which is impossible under the
# `external-global-alloc` feature (the consuming BINARY provides the
# allocator). Nothing in this repo links libpsp.a — cargo-psp builds bin
# crates against the rlib. Re-add "staticlib" only for stub-only exports.
crate-type = ["lib"]

[features]
default = []
std = []
# Compile this library as a stub provider. Useful to compile this as a static
# library for other projects.
stub-only = []
external-c-heap = []
# Build without panic unwinding support. This keeps no_std PSP apps on
# panic_abort and avoids building/linking panic_unwind + libunwind.
abort-only = []
# Let the consuming binary install its own #[global_allocator] and
# #[alloc_error_handler] instead of the per-allocation kernel-block
# SystemAlloc here (which makes one kernel object PER allocation and
# exhausts the ~4096 kernel-object cap under allocation-heavy crates).
external-global-alloc = []
embedded-graphics = [ "dep:embedded-graphics-core" ]

[dependencies]
paste = "1.0.15"
bitflags = "2.6.0"
libm = "0.2.8"
embedded-graphics-core = { version = "0.4.0", optional = true }
unstringify = "0.1.4"

[dependencies.num_enum]
version = "0.7.3"
default-features = false

[dependencies.num_enum_derive]
version = "0.7.3"
default-features = false
